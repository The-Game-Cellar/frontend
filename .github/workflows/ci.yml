name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: The-Game-Cellar/.github/.github/workflows/frontend.yml@main
    permissions:
      contents: read
      packages: write
    with:
      # Vite inlines VITE_* at build time, so the published image is tied to one
      # origin. Local development builds from source and is unaffected.
      api-url: https://gamecellar.app
